name: Build NN6000 v2 kernel only (BTF, gzip)

# Kernel-only build: toolchain + kernel + FIT image, no rootfs / packages.
# Uses the SAME config.seed as the full build, so the kernel .config (and
# therefore vermagic / symbol CRCs) is identical and works with existing kmods.
on:
  workflow_dispatch:
    inputs:
      openwrt_ref:
        description: 'OpenWrt commit to build (default: r38384 = running system base)'
        required: true
        default: '7424e2ca306c801eaf9c9dee23545af1a4e66d20'
      build_image:
        description: 'Also build packages + factory.bin / sysupgrade.bin (reuses the same caches)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  OWRT_REF: ${{ github.event.inputs.openwrt_ref || '7424e2ca306c801eaf9c9dee23545af1a4e66d20' }}
  KERNEL_SIZE_K: 12288

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout config repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          # run the slow deletes in the background so they overlap with apt/cache restore
          df -h / | tail -1
          nohup sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL >/dev/null 2>&1 &

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib gettext git libncurses5-dev libssl-dev python3 \
            python3-setuptools rsync unzip zlib1g-dev file wget curl

      # ---- Cache of the whole source tree AFTER tools+toolchain are built ----
      # Restores file mtimes too, so make sees tools/toolchain as up to date and skips
      # ~25-35 min. Feeds are also pinned by this cache (feeds are not pinned otherwise).
      - name: Restore tools+toolchain cache
        id: tc
        uses: actions/cache/restore@v4
        with:
          path: |
            openwrt
            !openwrt/dl
          key: owrt-tc-v1-${{ env.OWRT_REF }}

      - name: Clone OpenWrt at pinned commit
        if: steps.tc.outputs.cache-hit != 'true'
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git checkout "${{ env.OWRT_REF }}"

      - name: Record OpenWrt commit
        run: echo "OPENWRT_REF=$(git -C openwrt rev-parse HEAD)" >> $GITHUB_ENV

      - name: Use gzip FIT and enlarge KERNEL_SIZE (12M = full p10)
        run: |
          cd openwrt
          F=target/linux/qualcommax/image/ipq60xx.mk
          # The cached tree may still carry an earlier LZMA patch -- remove it.
          # LZMA FIT cannot be decompressed by this board's U-Boot (it boots only
          # the stock gzip FIT), so we must stay on the default Device/FitImage.
          # NOTE: v2 inherits from v1 ( "$(Device/link_nn6000-v1)" ), so an
          # earlier patch may live in EITHER block -- clean both.
          for DEV in link_nn6000-v1 link_nn6000-v2; do
            sed -i "/^define Device\/${DEV}$/,/^endef$/ { /\$(call Device\/FitImageLzma)/d; }" "$F"
          done
          # The old patch may have REPLACED FitImage with FitImageLzma in v1,
          # so restore the gzip default if the line is now missing.
          if ! sed -n '/^define Device\/link_nn6000-v1$/,/^endef$/p' "$F" | grep -Fq '$(call Device/FitImage)'; then
            sed -i '/^define Device\/link_nn6000-v1$/a\	$(call Device/FitImage)' "$F"
          fi
          # Other devices (e.g. 8devices_mango-dvk) legitimately use FitImageLzma,
          # so only verify the two NN6000 blocks -- not the whole file.
          for DEV in link_nn6000-v1 link_nn6000-v2; do
            sed -n "/^define Device\/${DEV}$/,/^endef$/p" "$F" | grep -q 'FitImageLzma' && {
              echo "ERROR: LZMA patch still present in ${DEV}!"; exit 1
            }
          done
          sed -n '/^define Device\/link_nn6000-v1$/,/^endef$/p' "$F" | grep -q '\$(call Device/FitImage)' || {
            echo "ERROR: FitImage missing in link_nn6000-v1!"; exit 1
          }
          # Stock KERNEL_SIZE is 6144k, but gzip+BTF+eBPF kernel is ~6.6M.
          # p10 (0:HLOS) is physically 12M, so raise the limit to fill the partition.
          sed -i '/^define Device\/link_nn6000-v1$/,/^endef$/ s|^\tKERNEL_SIZE := 6144k$|\tKERNEL_SIZE := 12288k|' "$F"
          grep -q 'KERNEL_SIZE := 12288k' "$F" || { echo "ERROR: KERNEL_SIZE patch not applied!"; exit 1; }
          echo "=== patched device definitions ==="
          sed -n '/^define Device\/link_nn6000-v1$/,/^endef$/p' "$F"
          sed -n '/^define Device\/link_nn6000-v2$/,/^endef$/p' "$F"
          # Cached tree may carry a stale LZMA-packed FIT from an earlier run.
          # Force repackaging so the .itb is rebuilt as gzip FIT.
          find build_dir -name 'link_nn6000-v2-uImage.itb' -delete 2>/dev/null || true
          find build_dir -name '*.itb' -path '*qualcommax*' -delete 2>/dev/null || true

      - name: Enable BPF_STREAM_PARSER (required by dae, off in generic config)
        run: |
          cd openwrt
          F=target/linux/qualcommax/ipq60xx/config-default
          for o in BPF_STREAM_PARSER STREAM_PARSER; do
            grep -q "^CONFIG_$o=y$" "$F" || echo "CONFIG_$o=y" >> "$F"
          done
          grep -E 'STREAM_PARSER' "$F"

      - name: Init feeds
        if: steps.tc.outputs.cache-hit != 'true'
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply config seed
        run: |
          cd openwrt
          cp ../config.seed .config
          echo 'CONFIG_CCACHE=y' >> .config     # speeds up re-runs of the kernel build
          make defconfig
          DEV='CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_link_nn6000-v2'
          sed -i "s/^# ${DEV} is not set/${DEV}=y/" .config
          grep -q "^${DEV}=y$" .config || echo "${DEV}=y" >> .config
          grep -q '^CONFIG_TARGET_qualcommax=y$' .config || echo 'CONFIG_TARGET_qualcommax=y' >> .config
          grep -q '^CONFIG_TARGET_qualcommax_ipq60xx=y$' .config || echo 'CONFIG_TARGET_qualcommax_ipq60xx=y' >> .config
          make oldconfig
          grep -q '^CONFIG_KERNEL_DEBUG_INFO_BTF=y$' .config || { echo "ERROR: BTF not enabled!"; exit 1; }
          grep -q "^${DEV}=y$" .config || { echo "ERROR: wrong device!"; exit 1; }
          echo "OK: BTF + device config verified"

      - name: Verify dae kernel options in .config
        run: |
          cd openwrt
          for o in KERNEL_DEBUG_INFO_BTF KERNEL_BPF_EVENTS KERNEL_KPROBES KERNEL_KPROBE_EVENTS KERNEL_CGROUP_BPF KERNEL_XDP_SOCKETS PACKAGE_kmod-sched-bpf PACKAGE_kmod-sched-core; do
            grep -q "^CONFIG_$o=y$" .config && echo "ok   $o" || { echo "MISSING $o"; exit 1; }
          done

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: owrt-dl-${{ env.OWRT_REF }}

      - name: Download sources
        run: |
          cd openwrt
          make -j$(nproc) download

      - name: Build tools + toolchain
        run: |
          cd openwrt
          make -j$(nproc) tools/install toolchain/install V=s

      - name: Save tools+toolchain cache
        if: steps.tc.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            openwrt
            !openwrt/dl
          key: owrt-tc-v1-${{ env.OWRT_REF }}

      # ccache dir lives inside the tree, so restore it only after the tree exists
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: openwrt/.ccache
          key: owrt-ccache-${{ env.OWRT_REF }}-${{ github.run_id }}
          restore-keys: owrt-ccache-${{ env.OWRT_REF }}-

      - name: Build kernel
        run: |
          cd openwrt
          make -j$(nproc) target/linux/compile V=s
          CCACHE_DIR="$PWD/.ccache" staging_dir/host/bin/ccache -s 2>/dev/null || true
          KC=$(find build_dir -path '*linux-qualcommax_ipq60xx/linux-*/.config' | head -1)
          for o in BPF_STREAM_PARSER KPROBES KPROBE_EVENTS BPF_EVENTS DEBUG_INFO_BTF NET_CLS_ACT NET_INGRESS NET_EGRESS; do
            grep -q "^CONFIG_$o=y$" "$KC" && echo "ok   $o" || { echo "MISSING in kernel .config: $o"; exit 1; }
          done
          grep -qE '^CONFIG_NET_SCH_INGRESS=[ym]$' "$KC" && grep -qE '^CONFIG_NET_CLS_BPF=[ym]$' "$KC" || { echo "MISSING SCH_INGRESS/CLS_BPF"; exit 1; }

      - name: Build full image (packages + factory.bin)
        if: ${{ inputs.build_image }}
        run: |
          cd openwrt
          make -j$(nproc) V=s

      - name: Build kernel FIT image
        if: ${{ !inputs.build_image }}
        run: |
          cd openwrt
          # Without rootfs the sysupgrade/factory steps fail on purpose; the FIT image
          # is produced before that. -k keeps going, we verify the itb ourselves.
          make target/linux/install -k V=s || true

      - name: Collect kernel
        run: |
          set -e
          mkdir -p release
          ITB=$(find openwrt/build_dir -name 'link_nn6000-v2-uImage.itb' | head -1)
          [ -n "$ITB" ] || { echo "ERROR: kernel itb not produced!"; exit 1; }
          SIZE=$(stat -c %s "$ITB"); LIMIT=$((KERNEL_SIZE_K*1024))
          echo "kernel itb: $SIZE bytes, limit: $LIMIT bytes, margin: $((LIMIT-SIZE))"
          [ "$SIZE" -le "$LIMIT" ] || { echo "ERROR: kernel too big (${SIZE} > ${LIMIT})"; exit 1; }
          cp "$ITB" release/kernel-hlos.itb
          truncate -s ${KERNEL_SIZE_K}k release/kernel-hlos.itb     # pad to partition-sized image
          cp "$ITB" release/kernel-raw.itb
          BINDIR=openwrt/bin/targets/qualcommax/ipq60xx
          cp "$BINDIR"/*-link_nn6000-v2-squashfs-factory.bin release/ 2>/dev/null || true
          cp "$BINDIR"/*-link_nn6000-v2-squashfs-sysupgrade.bin release/ 2>/dev/null || true
          cp "$BINDIR"/*-link_nn6000-v2.manifest release/ 2>/dev/null || true
          if [ "${{ inputs.build_image }}" = "true" ]; then
            ls release/*-factory.bin >/dev/null 2>&1 || { echo "ERROR: factory.bin not produced!"; exit 1; }
          fi
          cp openwrt/.config release/build.config
          KC=$(find openwrt/build_dir -path '*linux-qualcommax_ipq60xx/linux-*/.config' | head -1)
          if [ -n "$KC" ]; then
            cp "$KC" release/kernel.config
            echo "=== dae kernel options (resolved kernel .config) ==="
            grep -E '^(# )?CONFIG_(BPF|BPF_SYSCALL|BPF_JIT|CGROUPS|KPROBES|KPROBE_EVENTS|BPF_EVENTS|NET_INGRESS|NET_EGRESS|NET_SCH_INGRESS|NET_CLS_BPF|NET_CLS_ACT|BPF_STREAM_PARSER|DEBUG_INFO|DEBUG_INFO_REDUCED|DEBUG_INFO_BTF)[ =]' "$KC" | tee release/dae-check.txt
          fi
          VM=$(find openwrt/build_dir -path '*linux-qualcommax_ipq60xx/linux-*/.vermagic' | head -1)
          [ -n "$VM" ] && cp "$VM" release/vermagic.txt || true
          (cd release && sha256sum * > sha256sums.txt)
          ls -lh release/

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: openwrt/.ccache
          key: owrt-ccache-${{ env.OWRT_REF }}-${{ github.run_id }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nn6000-v2-kernel-${{ github.run_number }}
          path: release/
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-r${{ github.run_number }}
          name: NN6000 v2 kernel only - run #${{ github.run_number }}
          body: |
            BTF + eBPF kernel for Link NN6000 v2 (gzip FIT, U-Boot compatible). OpenWrt commit: ${{ env.OPENWRT_REF }}

            - kernel-hlos.itb -- gzip FIT padded to 12288k (full 0:HLOS partition), flash to mmcblk0p10. Keeps current rootfs/LuCI/config.
            - kernel-raw.itb  -- unpadded gzip FIT (~6.6M)
            - *-factory.bin   -- full image (when build_image=true), kernel+rootfs written by partition name
            - vermagic.txt    -- must match the running kernel's vermagic for existing kmods to load
            - build.config / sha256sums.txt

            NOTE: LZMA FIT is NOT used -- this board's U-Boot only boots the stock gzip FIT.

            Recommended: test first with U-Boot tftp boot of kernel-raw.itb (no flash write).
            Backup, then flash:
              dd if=/dev/mmcblk0p10 of=/tmp/hlos-backup.bin
              dd if=kernel-hlos.itb of=/dev/mmcblk0p10 bs=1M conv=fsync
              reboot
            Verify: ls -l /sys/kernel/btf/vmlinux
          files: release/*
          prerelease: true
