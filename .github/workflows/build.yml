name: Build OpenWrt NN6000 v2 (BTF kernel)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      openwrt_ref:
        description: 'OpenWrt commit to build (default: r38384 = running system base)'
        required: true
        default: '7424e2ca306c801eaf9c9dee23545af1a4e66d20'

permissions:
  contents: write

env:
  DEVICE: link_nn6000-v2
  # manual run uses the input; push uses the pinned default
  OWRT_REF: ${{ github.event.inputs.openwrt_ref || '7424e2ca306c801eaf9c9dee23545af1a4e66d20' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout config repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib gettext git libncurses5-dev libssl-dev python3 \
            python3-setuptools rsync unzip zlib1g-dev file wget curl ccache

      - name: Clone OpenWrt at pinned commit
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git checkout "${{ env.OWRT_REF }}"
          echo "OPENWRT_REF=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Shrink kernel image (gzip -> LZMA FIT)
        # BTF makes the FIT kernel ~6.6 MiB with gzip, over NN6000's 6144k KERNEL_SIZE.
        # LZMA FIT (already used by other qualcommax devices) is ~25-30% smaller.
        # Only v2 is changed; sysupgrade/factory/initramfs all use this KERNEL.
        run: |
          cd openwrt
          F=target/linux/qualcommax/image/ipq60xx.mk
          sed -i '/^define Device\/link_nn6000-v2$/,/^endef$/ s|^\t\$(Device/link_nn6000-v1)$|&\n\t$(call Device/FitImageLzma)|' "$F"
          sed -n '/^define Device\/link_nn6000-v2$/,/^endef$/p' "$F"
          grep -A3 'define Device/link_nn6000-v2' "$F" | grep -q 'FitImageLzma' || { echo "ERROR: LZMA patch not applied!"; exit 1; }

      - name: Init feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply config seed
        run: |
          cd openwrt
          cp ../config.seed .config
          make defconfig
          echo "=== device lines right after defconfig (diagnostic) ==="
          grep -i 'nn6000\|^CONFIG_TARGET_qualcommax' .config || true

          # .config/Kconfig device symbol (NOTE: no DEVICE_ right after TARGET_):
          #   CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_link_nn6000-v2
          # buildinfo/seed form has an extra DEVICE_ and is NOT what defconfig keeps.
          # Force the internal symbol on, then oldconfig (keeps set values).
          DEV='CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_link_nn6000-v2'
          sed -i "s/^# ${DEV} is not set/${DEV}=y/" .config
          grep -q "^${DEV}=y$" .config || echo "${DEV}=y" >> .config
          sed -i 's/^# CONFIG_PACKAGE_ipq-wifi-link_nn6000 is not set/CONFIG_PACKAGE_ipq-wifi-link_nn6000=y/' .config
          grep -q '^CONFIG_PACKAGE_ipq-wifi-link_nn6000=y$' .config || echo 'CONFIG_PACKAGE_ipq-wifi-link_nn6000=y' >> .config
          grep -q '^CONFIG_TARGET_qualcommax=y$' .config || echo 'CONFIG_TARGET_qualcommax=y' >> .config
          grep -q '^CONFIG_TARGET_qualcommax_ipq60xx=y$' .config || echo 'CONFIG_TARGET_qualcommax_ipq60xx=y' >> .config
          make oldconfig
          echo "=== device lines after oldconfig (diagnostic) ==="
          grep -i 'nn6000\|^CONFIG_TARGET_qualcommax' .config || true

      - name: Verify BTF config applied
        run: |
          cd openwrt
          echo "=== BTF kernel config ==="
          grep -E 'CONFIG_KERNEL_DEBUG_INFO' .config || true
          grep -q '^CONFIG_KERNEL_DEBUG_INFO_BTF=y$' .config || { echo "ERROR: BTF not enabled!"; exit 1; }
          grep -q '^CONFIG_KERNEL_DEBUG_INFO=y$' .config || { echo "ERROR: DEBUG_INFO not enabled!"; exit 1; }
          ! grep -q '^CONFIG_KERNEL_DEBUG_INFO_REDUCED=y$' .config || { echo "ERROR: DEBUG_INFO_REDUCED must be off!"; exit 1; }
          echo "=== target device ==="
          grep -i 'nn6000' .config || true
          grep -q '^CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_link_nn6000-v2=y$' .config || { echo "ERROR: wrong device!"; exit 1; }
          echo "OK: BTF + device config verified"

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: owrt-dl-${{ env.OWRT_REF }}

      - name: Download sources
        run: |
          cd openwrt
          make -j$(nproc) download

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s

      - name: Collect artifacts
        id: artifacts
        run: |
          set -e
          mkdir -p release
          BINDIR="openwrt/bin/targets/qualcommax/ipq60xx"
          echo "=== build output ==="
          ls -lh "$BINDIR" | head -60

          cp "$BINDIR"/*-link_nn6000-v2-squashfs-factory.bin release/ 2>/dev/null || true
          cp "$BINDIR"/*-link_nn6000-v2-squashfs-sysupgrade.bin release/ 2>/dev/null || true
          cp "$BINDIR"/*-link_nn6000-v2-initramfs-uImage.itb release/ 2>/dev/null || true

          # kernel FIT image = first 6144k (KERNEL_SIZE) of factory.bin -> flashes to 0:HLOS
          FACTORY=$(ls release/*-factory.bin 2>/dev/null | head -1 || true)
          if [ -n "$FACTORY" ]; then
            dd if="$FACTORY" of=release/kernel-hlos.itb bs=1k count=6144 status=none
            echo ">>> kernel-hlos.itb extracted (6144k) -> flash to 0:HLOS / mmcblk0p10"
          fi

          cp openwrt/.config release/build.config
          cp "$BINDIR"/*-link_nn6000-v2.manifest release/ 2>/dev/null || true

          echo "=== release dir ==="
          ls -lh release/
          [ -n "$FACTORY" ] || { echo "ERROR: factory.bin not produced!"; exit 1; }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nn6000-v2-btf-${{ github.run_number }}
          path: release/
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: btf-r${{ github.run_number }}
          name: NN6000 v2 BTF kernel - run #${{ github.run_number }}
          body: |
            OpenWrt build for Link NN6000 v2 with kernel BTF enabled (CO-RE eBPF ready).

            - OpenWrt commit: ${{ env.OPENWRT_REF }}
            - Device: ${{ env.DEVICE }}  |  Run: #${{ github.run_number }}

            Files:
            - kernel-hlos.itb  -- kernel only (6144k). Flash to 0:HLOS (mmcblk0p10) to add BTF while keeping current rootfs/LuCI/config.
            - *-factory.bin    -- full image, flash via U-Boot (rebuilds kernel + rootfs; LuCI/proxy kmods included).
            - *-sysupgrade.bin -- full image for in-system sysupgrade.
            - *-initramfs-uImage.itb -- rescue kernel (U-Boot tftp boot, no disk write).
            - build.config     -- exact .config used; check BTF options here.

            Flash kernel only (from running OpenWrt):
              dd if=/dev/mmcblk0p10 of=/tmp/hlos-backup.bin   # backup first
              dd if=kernel-hlos.itb of=/dev/mmcblk0p10 bs=1M conv=fsync
              reboot

            Verify BTF after boot:
              ls -l /sys/kernel/btf/vmlinux
              bpftool btf dump file /sys/kernel/btf/vmlinux format c | head
          files: |
            release/*
          prerelease: true
